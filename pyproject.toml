[project]
name = "ha-dashboard-player"
version = "0.3.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TRY"]
ignore = [
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "TRY003",
  "TRY300",
  "TRY301",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC230", "ASYNC240", "PLC0415", "SLF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
