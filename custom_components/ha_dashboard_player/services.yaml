preload_media:
  target:
    entity:
      integration: ha_dashboard_player
      domain: media_player
  fields:
    media_url:
      required: true
      example: "https://example.com/video.mp4"
      selector:
        text:
          type: url

clear_screen:
  target:
    entity:
      integration: ha_dashboard_player
      domain: media_player

report_state:
  target:
    entity:
      integration: ha_dashboard_player
      domain: media_player
  fields:
    state:
      example: "playing"
      selector:
        select:
          options:
            - playing
            - paused
    media_position:
      example: 12.5
      selector:
        number:
          min: 0
          max: 86400
          step: 0.1
          unit_of_measurement: s
          mode: box
    media_duration:
      example: 120.0
      selector:
        number:
          min: 0
          max: 86400
          step: 0.1
          unit_of_measurement: s
          mode: box
    volume_level:
      example: 0.7
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    is_volume_muted:
      example: true
      selector:
        boolean:
    repeat:
      example: "one"
      selector:
        select:
          options:
            - "off"
            - one
            - all

media_ended:
  target:
    entity:
      integration: ha_dashboard_player
      domain: media_player
  fields:
    media_content_id:
      example: "media-source://media_source/local/video.mp4"
      selector:
        text:
